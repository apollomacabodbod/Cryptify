name: ReactJs Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run linting
      # (Optional) If you want the pipeline to continue even if linting fails,
      # you can change this to `run: npm run lint || true`
      - name: Run ESLint
        run: npm run lint

      # Step 5: Build the project
      - name: Run build
        run: npm run build
        env:
          CI: false # This prevents minor warnings from failing the build
